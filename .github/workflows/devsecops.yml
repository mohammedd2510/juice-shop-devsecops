name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_REPO: ghcr.io/${{ github.repository }}
  IMAGE_SHA:  ghcr.io/${{ github.repository }}:${{ github.sha }}

permissions:
  contents: read
  packages: write

jobs:

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks
          path: results.sarif

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        continue-on-error: true
        run: semgrep scan --config auto --sarif-output=semgrep.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep
          path: semgrep.sarif

  retirejs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Install Retire.js
        run: npm install -g retire

      - name: Retire.js scan
        continue-on-error: true
        run: retire --outputformat json --outputpath retire.json --verbose

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retirejs
          path: retire.json

  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-config
          path: trivy-config.sarif

  build-push:
    runs-on: ubuntu-latest
    needs: [gitleaks, semgrep, retirejs, trivy-config]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_SHA }}
            ${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-image:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_SHA }}
          format: sarif
          output: trivy-image.sarif

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image
          path: trivy-image.sarif

  zap:
    runs-on: ubuntu-latest
    needs: build-push
    services:
      juiceshop:
        image: ghcr.io/${{ github.repository }}:${{ github.sha }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 3000:3000
    steps:
      - name: Wait for Juice Shop
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:3000/ >/dev/null; then
              echo "Juice Shop is up"; exit 0
            fi
            echo "waiting... ($i)"; sleep 2
          done
          echo "Juice Shop failed to respond"; exit 1

      - name: ZAP Baseline
        uses: zaproxy/action-baseline@v0.13.0
        with:
          target: http://localhost:3000
          allow_issue_writing: false

  defectdojo:
    runs-on: ubuntu-latest
    needs: [gitleaks, semgrep, retirejs, trivy-config, trivy-image, zap]
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Import Gitleaks
        uses: portswigger-cloud/defectdojo-import-scan@v1
        continue-on-error: true
        with:
          defectdojo-url:    ${{ secrets.DEFECTDOJO_URL }}
          defectdojo-api-key: ${{ secrets.DEFECTDOJO_API_TOKEN }}
          scan-type: 'Gitleaks Scan'
          engagement-name: ${{ github.repository }}
          product-name: 'Juice Shop DevSecOps'
          report-file: reports/gitleaks/results.sarif
          auto-create-engagement: 'true'

      - name: Import Semgrep
        uses: portswigger-cloud/defectdojo-import-scan@v1
        continue-on-error: true
        with:
          defectdojo-url:    ${{ secrets.DEFECTDOJO_URL }}
          defectdojo-api-key: ${{ secrets.DEFECTDOJO_API_TOKEN }}
          scan-type: 'Semgrep JSON Report'
          engagement-name: ${{ github.repository }}
          product-name: 'Juice Shop DevSecOps'
          report-file: reports/semgrep/semgrep.sarif
          auto-create-engagement: 'true'

      - name: Import Retire.js
        uses: portswigger-cloud/defectdojo-import-scan@v1
        continue-on-error: true
        with:
          defectdojo-url:    ${{ secrets.DEFECTDOJO_URL }}
          defectdojo-api-key: ${{ secrets.DEFECTDOJO_API_TOKEN }}
          scan-type: 'Retire.js Scan'
          engagement-name: ${{ github.repository }}
          product-name: 'Juice Shop DevSecOps'
          report-file: reports/retirejs/retire.json
          auto-create-engagement: 'true'

      - name: Import Trivy Config
        uses: portswigger-cloud/defectdojo-import-scan@v1
        continue-on-error: true
        with:
          defectdojo-url:    ${{ secrets.DEFECTDOJO_URL }}
          defectdojo-api-key: ${{ secrets.DEFECTDOJO_API_TOKEN }}
          scan-type: 'Trivy Scan'
          engagement-name: ${{ github.repository }}
          product-name: 'Juice Shop DevSecOps'
          report-file: reports/trivy-config/trivy-config.sarif
          auto-create-engagement: 'true'

      - name: Import Trivy Image
        uses: portswigger-cloud/defectdojo-import-scan@v1
        continue-on-error: true
        with:
          defectdojo-url:    ${{ secrets.DEFECTDOJO_URL }}
          defectdojo-api-key: ${{ secrets.DEFECTDOJO_API_TOKEN }}
          scan-type: 'Trivy Scan'
          engagement-name: ${{ github.repository }}
          product-name: 'Juice Shop DevSecOps'
          report-file: reports/trivy-image/trivy-image.sarif
          auto-create-engagement: 'true'

      - name: Import ZAP
        uses: portswigger-cloud/defectdojo-import-scan@v1
        continue-on-error: true
        with:
          defectdojo-url:    ${{ secrets.DEFECTDOJO_URL }}
          defectdojo-api-key: ${{ secrets.DEFECTDOJO_API_TOKEN }}
          scan-type: 'ZAP Scan'
          engagement-name: ${{ github.repository }}
          product-name: 'Juice Shop DevSecOps'
          report-file: reports/zap_scan/report_json.json
          auto-create-engagement: 'true'

  deploy:
    runs-on: ubuntu-latest
    needs: defectdojo
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE_SHA }}
            docker rm -f juice-shop || true
            docker run -d --name juice-shop -p 3000:3000 ${{ env.IMAGE_SHA }}