name: Terraform DevSecOps Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose action to perform"
        required: true
        type: choice
        options:
          - apply
          - destroy

env:
  TF_WORKING_DIR: Terraform-IAC
  AWS_ROLE_ARN:   arn:aws:iam::167140819348:role/GithubActions_Role
  AWS_REGION:     us-east-1

permissions:
  contents: read
  id-token: write

jobs:

  plan:
    name: Terraform Plan (${{ github.event.inputs.action }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-actions-tf-plan

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          if [ "${{ github.event.inputs.action }}" == "destroy" ]; then
            terraform plan -destroy -out=tfplan
          else
            terraform plan -out=tfplan
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan

  security-scan:
    name: IaC Security Scans
    if: github.event.inputs.action == 'apply'
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        continue-on-error: true
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}
          format: json
          additional_args: --out tfsec.json --soft-fail

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfsec
          path: tfsec.json

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        continue-on-error: true
        with:
          directory: ${{ env.TF_WORKING_DIR }}
          framework: terraform
          output_format: json
          output_file_path: checkov-results
          soft_fail: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov
          path: checkov-results/results_json.json

  publish-to-defectdojo:
    name: Publish IaC findings to DefectDojo
    if: github.event.inputs.action == 'apply'
    needs: security-scan
    runs-on: ubuntu-latest
    env:
      DD_URL: http://defectdojo.local
      DD_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
      PRODUCT_TYPE: 'Research and Development'
      PRODUCT: 'Juice Shop DevSecOps'
      ENVIRONMENT: 'Development'
      ENGAGEMENT: juice-shop-${{ github.ref_name }}
    steps:
      - name: Map defectdojo.local in /etc/hosts
        run: echo "${{ secrets.DEFECTDOJO_HOST_IP }} defectdojo.local" | sudo tee -a /etc/hosts

      - uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Upload tfsec findings
        continue-on-error: true
        run: |
          curl -sS -X POST "${DD_URL}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${DD_TOKEN}" \
            -F "product_type_name=${PRODUCT_TYPE}" \
            -F "product_name=${PRODUCT}" \
            -F "engagement_name=${ENGAGEMENT}" \
            -F "environment=${ENVIRONMENT}" \
            -F "scan_type=TFSec Scan" \
            -F "auto_create_context=true" \
            -F "file=@reports/tfsec/tfsec.json"

      - name: Upload Checkov findings
        continue-on-error: true
        run: |
          curl -sS -X POST "${DD_URL}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${DD_TOKEN}" \
            -F "product_type_name=${PRODUCT_TYPE}" \
            -F "product_name=${PRODUCT}" \
            -F "engagement_name=${ENGAGEMENT}" \
            -F "environment=${ENVIRONMENT}" \
            -F "scan_type=Checkov Scan" \
            -F "auto_create_context=true" \
            -F "file=@reports/checkov/results_json.json"

  execute:
    name: Terraform ${{ github.event.inputs.action }}
    needs: [plan, security-scan, publish-to-defectdojo]
    if: always() && needs.plan.result == 'success' && (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped') && (needs.publish-to-defectdojo.result == 'success' || needs.publish-to-defectdojo.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-actions-tf-${{ github.event.inputs.action }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply / Destroy
        run: terraform apply -auto-approve tfplan

      - name: Print outputs
        if: github.event.inputs.action == 'apply'
        run: |
          echo "=== Outputs ==="
          terraform output -json
          EC2_ID=$(terraform output -raw ec2_instance_id)
          echo ""
          echo "EC2 instance ID: $EC2_ID"
          echo "EC2 Instance Public IP: $(terraform output -raw ec2_public_ip)"
          echo "Update EC2_INSTANCE_ID in .github/workflows/cicd-devsecops.yml with this value."