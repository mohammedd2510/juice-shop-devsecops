name: Terraform DevSecOps Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose action to perform"
        required: true
        type: choice
        options:
          - apply
          - destroy

env:
  TF_WORKING_DIR: Terraform-IAC

permissions:
  contents: read

jobs:

  plan:
    name: Terraform Plan (${{ github.event.inputs.action }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          if [ "${{ github.event.inputs.action }}" == "destroy" ]; then
            terraform plan -destroy -out=tfplan
          else
            terraform plan -out=tfplan
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan

  security-scan:
    name: IaC Security Scans
    if: github.event.inputs.action == 'apply'
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        continue-on-error: true
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}
          sarif_file: tfsec.sarif

      - name: Debug - find tfsec output
        if: always()
        run: |
          echo "--- searching for tfsec*.sarif ---"
          find . -name 'tfsec*.sarif' -ls 2>/dev/null || echo "nothing found"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfsec
          path: ${{ env.TF_WORKING_DIR }}/tfsec.sarif

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        continue-on-error: true
        with:
          directory: ${{ env.TF_WORKING_DIR }}
          framework: terraform
          output_format: json
          output_file_path: checkov-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov
          path: checkov-results/results_sarif.sarif

  defectdojo:
    name: Import IaC Scans to DefectDojo
    if: github.event.inputs.action == 'apply'
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Import tfsec
        uses: portswigger-cloud/defectdojo-import-scan@v1
        continue-on-error: true
        with:
          defectdojo-url: ${{ secrets.DEFECTDOJO_URL }}
          defectdojo-username: admin
          defectdojo-password: ${{ secrets.DEFECTDOJO_ADMIN_PASSWORD }}
          defectdojo-product-type: 'Research and Development'
          defectdojo-product: 'Juice Shop DevSecOps'
          defectdojo-environment-type: 'Development'
          defectdojo-scan-type: 'SARIF'
          defectdojo-engagement-name: terraform-iac-${{ github.ref_name }}
          scan-results-file-name: reports/tfsec/tfsec.sarif

      - name: Import Checkov
        uses: portswigger-cloud/defectdojo-import-scan@v1
        continue-on-error: true
        with:
          defectdojo-url: ${{ secrets.DEFECTDOJO_URL }}
          defectdojo-username: admin
          defectdojo-password: ${{ secrets.DEFECTDOJO_ADMIN_PASSWORD }}
          defectdojo-product-type: 'Research and Development'
          defectdojo-product: 'Juice Shop DevSecOps'
          defectdojo-environment-type: 'Development'
          defectdojo-scan-type: 'Checkov Scan'
          defectdojo-engagement-name: terraform-iac-${{ github.ref_name }}
          scan-results-file-name: reports/checkov/results_sarif.sarif

  execute:
    name: Terraform ${{ github.event.inputs.action }}
    needs: [plan, security-scan, defectdojo]
    if: always() && needs.plan.result == 'success' && (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped') && (needs.defectdojo.result == 'success' || needs.defectdojo.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Apply / Destroy
        run: terraform apply -auto-approve tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Print outputs
        if: github.event.inputs.action == 'apply'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "EC2 host: $(terraform output -raw ec2_host)"
          echo "EC2 IP:   $(terraform output -raw ec2_public_ip)"
          echo ""
          echo "Set these as repo secrets (from your laptop):"
          echo "  gh secret set EC2_HOST --body '<host-above>'"
          echo "  gh secret set EC2_USER --body 'ec2-user'"
          echo "  gh secret set EC2_SSH_PRIVATE_KEY --body \"\$(terraform output -raw ssh_private_key)\""
